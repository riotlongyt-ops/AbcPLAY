<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>abcPlay — Streaming perfected.</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Landing / Slideshow State -->
    <section id="landing" class="viewport landing-visible">
      <div id="slideshow" class="slideshow">
        <!-- slides populated by JS -->
      </div>

      <div class="vignette top"></div>
      <div class="vignette bottom"></div>

      <div class="glass-card">
        <div class="brand">
          <div class="logo">abc<span>Play</span></div>
          <div class="tagline">Streaming perfected.</div>
        </div>
        <button id="enterBtn" class="cta neon-pulse">Go to Full Site</button>
      </div>

      <div class="slide-controls">
        <div id="dots" class="dots"></div>
      </div>
    </section>

    <!-- Dashboard / Main App State -->
    <section id="dashboard" class="viewport dashboard-hidden">
      <header class="topbar">
        <div class="brand-left" style="display:flex;align-items:center;gap:12px;width:100%;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:12px;flex:1">
            <div class="logo small">abc<span>Play</span></div>
          </div>

          <!-- center nav -->
          <nav class="nav" style="flex:1;display:flex;justify-content:center;gap:12px">
            <a href="#" data-nav="home" class="active">Home</a>
            <a href="#" data-nav="newest" id="navNewest">Newest Movies</a>
            <a href="#" data-nav="tv">Shows</a>
            <a href="#" data-nav="list">My List</a>
          </nav>
        </div>

        <div class="search-wrap">
          <input id="searchInput" class="search" placeholder="Search movies, shows (TMDB)..." autocomplete="off" />
          <div id="autocomplete" class="autocomplete glass hidden"></div>
        </div>

        <div class="right-actions" style="display:flex;align-items:center;gap:10px">
          <button id="signupBtn" class="icon-btn">Sign Up</button>
          <button class="icon-btn">Profile</button>
        </div>
      </header>

      <main class="main">
        <section class="hero">
          <div class="hero-inner">
            <h1 id="heroTitle">Featured</h1>
            <p id="heroSubtitle">Hand-picked cinematic picks</p>
          </div>
        </section>

        <div id="carousels" class="carousels">
          <!-- Carousels populated by JS -->
        </div>
      </main>
    </section>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content glass">
        <button id="modalClose" class="modal-close">✕</button>
        <div class="modal-body">
          <div class="media-side">
            <div id="mediaPoster" class="poster skeleton"></div>
            <div class="media-actions">
              <button id="playBtn" class="play-btn neon">Play</button>
            </div>
          </div>
          <div class="info-side">
            <h2 id="modalTitle">Title</h2>
            <div id="metaRow" class="meta">Year • Rating • Runtime</div>
            <div id="genreTags" class="tags"></div>
            <p id="description" class="description"></p>

            <div id="playerSim" class="player-sim hidden">
              <!-- Dual-tab: Watch Movie (VidLink) vs View Trailer (YouTube) -->
              <div class="server-switcher glass player-tabs">
                <button data-tab="movie" class="tab-btn active">🎬 Watch Movie</button>
                <button data-tab="trailer" class="tab-btn">📺 View Trailer</button>

                <div id="episodeControls" class="episode-controls hidden" style="margin-left:auto">
                  <label>Season <select id="seasonSelect"><option>1</option></select></label>
                  <label>Episode <select id="episodeSelect"><option>1</option></select></label>
                </div>
              </div>

              <!-- Containers: these will be fully cleared (innerHTML='') to force iframe teardown -->
              <div id="movieContainer" class="vidlink-wrap" style="background:#000"></div>
              <div id="trailerContainer" class="trailer-wrap hidden"></div>

              <div class="player-controls" style="padding:8px">Server: VidLink.pro (embedded) · Trailer (YouTube)</div>
              <div id="buffer" class="buffer hidden"></div>
            </div>
          </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
